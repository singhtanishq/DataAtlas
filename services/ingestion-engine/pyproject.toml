[project]
name = "dataatlas-ingestion"
version = "0.1.0"
description = "DataAtlas metadata ingestion, profiling and quality engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "sqlglot>=25.0",
    "nats-py>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
# The profiler and quality engine interpolate schema-qualified identifiers
# into sampling queries. Identifiers are validated and quoted; all values
# are bound parameters.
"app/profiling/**" = ["S608"]
"app/quality/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["asyncpg.*", "nats.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring live local infrastructure",
]
