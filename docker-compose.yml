# ============================================================
# DataAtlas — local development infrastructure
# Usage: docker compose up -d
# Optional profiles: observability (otel-collector, prometheus, grafana)
# ============================================================

name: dataatlas

services:
  postgres:
    image: postgres:18-alpine
    container_name: dataatlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataatlas}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql
      # so pg_upgrade can relink data across major versions.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataatlas} -d ${POSTGRES_DB:-dataatlas}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: dataatlas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    container_name: dataatlas-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  object-storage:
    # S3-compatible object storage for local development.
    # MinIO gated its community images behind authentication (Docker Hub and
    # quay.io both require login since 2025), so the local stack uses
    # SeaweedFS in single-binary dev mode (master + volume + S3 gateway).
    # API contract is standard S3; applications use the AWS S3 SDK.
    image: chrislusf/seaweedfs:3.97
    container_name: dataatlas-object-storage
    command:
      - "server"
      - "-dir=/data"
      - "-master.volumeSizeLimitMB=2048"
      - "-volume.max=0"
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.local.json"
      - "-idleTimeout=60"
    ports:
      - "9000:8333" # S3 API
      - "9001:9333" # Master UI
    volumes:
      - object-data:/data
      - ./infra/seaweedfs/s3.local.json:/etc/seaweedfs/s3.local.json:ro
    healthcheck:
      # Use 127.0.0.1 explicitly: the image has no IPv6 listener, so a
      # `localhost` probe can resolve to ::1 and fail spuriously.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: dataatlas-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter
    profiles: ["observability"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: dataatlas-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["observability"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: dataatlas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    profiles: ["observability"]
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  object-data:
  prometheus-data:
  grafana-data:
