# Prometheus scrape configuration for local DataAtlas development.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application services register these targets once metrics endpoints ship
  # (control plane /metrics and ingestion engine /metrics).
  - job_name: "dataatlas-control-plane"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "dataatlas-ingestion-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
